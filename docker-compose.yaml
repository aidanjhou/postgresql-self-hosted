services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    configs:
      - source: init_sh
        target: /docker-entrypoint-initdb.d/init.sh

configs:
  init_sh:
    content: |
      #!/bin/bash
      set -e

      # 批量将 vector 和 pg_trgm 标记为受信任扩展 (trusted = true)
      # 允许非超级用户在自己拥有的数据库中自主安装，无权限阻碍
      for ext in vector pg_trgm; do
        CONTROL_FILE=$(find /usr -name "${ext}.control" 2>/dev/null | head -n 1)
        if [ -n "$CONTROL_FILE" ] && ! grep -q "^trusted" "$CONTROL_FILE"; then
          echo "trusted = true" >> "$CONTROL_FILE"
        fi
      done

volumes:
  pg_data:
    driver: local
